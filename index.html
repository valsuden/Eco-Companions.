<!doctype html>
<html lang="es">
  <head>
    <script>
      // Defensive polyfill/wrapper to prevent "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when browser extensions or aggressive polyfills try to do `window.fetch = ...` directly.
      const _originalFetch = window.fetch;
      Object.defineProperty(window, 'fetch', {
        configurable: true,
        enumerable: true,
        get: function() { return window._customFetch || _originalFetch; },
        set: function(val) { window._customFetch = val; }
      });
    </script>
